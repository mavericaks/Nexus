# ─────────────────────────────────────────────────────────────
# Nexus CI/CD Pipeline
# Per playbook §6: all 8 steps, no shortcuts.
#
# Triggers: every push and PR to main.
# Steps: lint → secret scan → STUB grep → dependency scan →
#         unit tests → integration tests → Docker build →
#         deploy (main only)
# ─────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Step 1: Lint / Format Check ─────────────────────────────
  lint:
    name: "1. Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile (lint check)
        run: |
          chmod +x ./mvnw
          ./mvnw compile --no-transfer-progress -B

  # ── Step 2: Secret Scan ─────────────────────────────────────
  secret-scan:
    name: "2. Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Step 3: STUB Grep ───────────────────────────────────────
  stub-grep:
    name: "3. STUB: Marker Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for unresolved STUBs
        run: |
          if grep -rnw --include='*.java' . -e 'STUB:'; then
            echo "::error::Found unresolved 'STUB:' markers in Java source. Fix them before merging."
            exit 1
          else
            echo "✓ No STUB markers found."
          fi

  # ── Step 4: Dependency Vulnerability Scan ───────────────────
  dependency-scan:
    name: "4. Dependency Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: OWASP Dependency Check
        run: |
          chmod +x ./mvnw
          ./mvnw org.owasp:dependency-check-maven:check \
            --no-transfer-progress -B \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            || true
        # Note: || true to not fail on first run while NVD populates.
        # Remove || true once the NVD database is cached.

  # ── Steps 5 & 6: Unit + Integration Tests ──────────────────
  test:
    name: "5-6. Tests"
    runs-on: ubuntu-latest
    needs: [ lint, stub-grep ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run all tests (Testcontainers for Postgres + Kafka)
        run: |
          chmod +x ./mvnw
          ./mvnw verify --no-transfer-progress -B
        env:
          # Tests use Testcontainers (auto-managed) — no external services needed.
          # AI services are mocked in tests — no real Groq/Gemini calls.
          GROQ_API_KEY: "test-not-used"
          GEMINI_API_KEY: "test-not-used"
      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: nexus-app/target/site/jacoco/
          retention-days: 14

  # ── Step 7: Docker Build ────────────────────────────────────
  docker-build:
    name: "7. Docker Build"
    runs-on: ubuntu-latest
    needs: [ test, secret-scan, dependency-scan ]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nexus-app:${{ github.sha }} .
      - name: Verify image
        run: docker images nexus-app:${{ github.sha }}

  # ── Step 8: Deploy to Render (main only) ────────────────────
  deploy:
    name: "8. Deploy to Render"
    runs-on: ubuntu-latest
    needs: [ docker-build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo ""
          echo "✓ Render deploy triggered."
