# Test configuration — used by @WebMvcTest and @SpringBootTest
# Provides the JWT secret so SecurityConfig can initialize

nexus:
  security:
    jwt:
      secret: test-secret-key-must-be-at-least-32-bytes-long-for-hs256!!
      expiration-hours: 1
      issuer: nexus-test
  ai:
    confidence-threshold: 0.75
    auto-resolve-enabled: false
    max-retrieval-results: 3

# Dummy OAuth2 config — prevents Spring from failing at startup
# when it auto-configures the OAuth2 client.
# These values are never actually used (tests bypass security filters).
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
  # Spring AI test config — dummy keys so auto-configuration doesn't fail.
  # Tests use mock/fake adapters, never real AI services.
  ai:
    openai:
      api-key: test-groq-key-not-real
      base-url: https://api.groq.com/openai
    google:
      genai:
        embedding:
          api-key: test-gemini-key-not-real
  # Disable caching in tests — no Redis required.
  # Tests verify logic, not cache infrastructure.
  cache:
    type: none
  # Prevent Spring Data Redis auto-config from failing when no Redis is available.
  data:
    redis:
      host: localhost
      port: 16379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
