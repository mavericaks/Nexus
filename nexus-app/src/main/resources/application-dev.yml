# Nexus — Dev Profile
# Activated with: --spring.profiles.active=dev
# Connects to the local Docker Compose services (docker compose up -d).

spring:
  # ─── Datasource — the RUNNING APP connects as nexus_app ────────────
  # This is the low-privilege role created by V2__rls_policies.sql.
  # RLS policies filter its queries by tenant_id automatically.
  # Port 15432 = Docker Compose host port (avoids Hyper-V conflicts).
  datasource:
    url: jdbc:postgresql://localhost:15432/nexus
    username: nexus_app
    password: nexus_app_local
    driver-class-name: org.postgresql.Driver

  # ─── JPA dev overrides ─────────────────────────────────────────────
  jpa:
    # Show the SQL Hibernate generates — noisy, but invaluable for
    # catching N+1 queries and understanding what JPA actually does.
    show-sql: true
    properties:
      hibernate:
        # Pretty-print the SQL so it's readable in the console.
        format_sql: true

  # ─── Flyway — runs as the OWNER role (nexus), not the app role ─────
  # Flyway needs DDL privileges to create/alter tables.
  # The app role (nexus_app) only has CRUD permissions.
  flyway:
    url: jdbc:postgresql://localhost:15432/nexus
    user: nexus
    password: nexus_local
    # In dev, wipe and re-run all migrations if they get out of sync.
    # NEVER enable this in prod — it drops the entire schema first.
    clean-disabled: false

  # ─── OAuth2 — Google login ─────────────────────────────────────────
  # Spring Security auto-configures the OAuth2 login flow from this.
  # Redirect URI: http://localhost:8080/login/oauth2/code/google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

  # ─── Kafka configuration (Phase 5) ────────────────────────────────
  # Spring Boot auto-configures KafkaTemplate and consumer factory
  # from these settings. Port 19092 = Docker Compose host port.
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: nexus-app-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # ─── Redis configuration (Phase 6) ─────────────────────────────────
  # Used for @Cacheable (RAG search results) and rate limiting.
  # Port 16379 = Docker Compose host port. Production: Upstash Redis.
  data:
    redis:
      host: localhost
      port: 16379

# ─── Security — JWT configuration ──────────────────────────────────
# HMAC-SHA256 secret must be at least 256 bits (32 bytes).
# This is a DEV-ONLY key — production would use env variable / Vault.
nexus:
  security:
    jwt:
      secret: nexus-dev-secret-key-must-be-at-least-32-bytes-long!!
      expiration-hours: 24
      issuer: nexus-dev
    # Owner datasource — used ONLY for auth queries (login) that need
    # to bypass RLS. The app role (nexus_app) has RLS enforced, but
    # during login we don't know the tenant yet.
    auth-datasource:
      jdbc-url: jdbc:postgresql://localhost:15432/nexus
      username: nexus
      password: nexus_local
  # ─── AI Triage configuration ──────────────────────────────────────
  ai:
    # Confidence threshold for auto-resolution.
    # Below this → escalate to human. Above → auto-resolve.
    confidence-threshold: 0.75
    # Kill switch — set to false to disable AI auto-resolution at runtime.
    # Falls back to "AI drafts, human always approves" mode.
    auto-resolve-enabled: true
    # Max KB articles to retrieve for RAG context.
    max-retrieval-results: 5
  # ─── Rate Limiting (Phase 6) ────────────────────────────────────────
  # Per-tenant sliding window rate limiter backed by Redis.
  # In dev, set generously. In production, tie to plan tier.
  rate-limit:
    requests-per-window: 100
    window-seconds: 60

# ─── Spring AI — Groq (OpenAI-compatible endpoint) ──────────────────
# Groq implements the OpenAI chat/completions API, so we use the
# OpenAI starter pointed at Groq's base URL.
spring.ai:
  openai:
    api-key: ${GROQ_API_KEY}
    base-url: https://api.groq.com/openai
    chat:
      options:
        model: llama-3.3-70b-versatile
        temperature: 0.1
        max-tokens: 2048
  # ─── Gemini Embedding API ───────────────────────────────────────────
  # Separate from Groq — used to convert text → vectors for RAG.
  google:
    genai:
      embedding:
        api-key: ${GEMINI_API_KEY}
        options:
          model: text-embedding-004
# ─── Logging configuration ──────────────────────────────────────────
logging:
  level:
    com.nexus: DEBUG
    org.springframework.security: DEBUG
