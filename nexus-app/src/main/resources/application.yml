# Nexus Application Configuration
# Profile-specific config goes in application-{profile}.yml files.
# This file holds defaults shared across all profiles.

spring:
  application:
    name: nexus

  # ─── JPA / Hibernate (shared across all profiles) ──────────────────
  jpa:
    # Flyway owns the schema — Hibernate only checks that entities match it.
    # "validate" = crash on startup if an entity field doesn't match a column,
    # but never create/alter/drop tables itself.
    hibernate:
      ddl-auto: validate

    # OSIV (Open Session In View) keeps a Hibernate session open for the
    # entire HTTP request — convenient, but masks lazy-loading bugs and
    # causes surprise N+1 queries. We disable it and load data explicitly.
    open-in-view: false

    properties:
      hibernate:
        # Use the modern Hibernate 6 naming strategy that converts
        # camelCase Java fields to snake_case SQL columns automatically.
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  # ─── Flyway (shared across all profiles) ───────────────────────────
  flyway:
    enabled: true
    # Migration scripts live here. Flyway runs them in version order
    # (V1__, V2__, ...) and tracks which have already been applied.
    locations: classpath:db/migration

# ─── Server ──────────────────────────────────────────────────────────
server:
  port: 8080

# ─── Actuator / Metrics ──────────────────────────────────────────────
# Expose health, info, and Prometheus endpoints.
# Prometheus endpoint is scraped by the Prometheus container (docker-compose).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      # Global tag applied to all metrics — useful for filtering in Grafana
      # when multiple services report to the same Prometheus instance.
      application: nexus
    distribution:
      # Record p50, p90, p95, p99 percentiles for triage duration
      percentiles-histogram:
        ticket.triage.duration: true

# ─── Resilience4j ────────────────────────────────────────────────────
# Circuit breaker + retry config for the LLM (Groq) integration.
# These settings protect the API from cascading failures when Groq is down.
resilience4j:
  circuitbreaker:
    instances:
      groq-llm:
        # Register health indicator so actuator shows circuit state
        registerHealthIndicator: true
        # Use a count-based sliding window (last N calls)
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        # Minimum calls before the circuit breaker starts evaluating
        minimumNumberOfCalls: 5
        # If 50% of calls fail → open the circuit
        failureRateThreshold: 50
        # Stay open for 30 seconds before trying a half-open probe
        waitDurationInOpenState: 30s
        # Allow 3 probe calls in half-open state to test recovery
        permittedNumberOfCallsInHalfOpenState: 3
        # Automatically transition from open → half-open after wait
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      groq-llm:
        # Retry up to 3 times before giving up
        maxAttempts: 3
        # Wait 500ms between retries (exponential backoff kicks in)
        waitDuration: 500ms
        # Exponential backoff: 500ms → 1s → 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

# ─── Demo Mode ────────────────────────────────────────────────────
# When enabled, registers the /api/v1/auth/demo-login endpoint.
# ONLY enable for portfolio demos — never in production.
nexus:
  demo:
    enabled: ${DEMO_MODE:false}

# ─── OpenAPI / Swagger UI ─────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

